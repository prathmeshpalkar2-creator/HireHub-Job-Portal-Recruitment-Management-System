server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hirehub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hirehub_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

hirehub:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  admin:
    email: ${INITIAL_ADMIN_EMAIL:admin@hirehub.com}
    password: ${INITIAL_ADMIN_PASSWORD:Admin@123456}
    name: ${INITIAL_ADMIN_NAME:HireHub System Administrator}
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads/resumes}
